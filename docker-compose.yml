version: "3.8"

services:
  # ─── FastAPI Backend ───
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techpulse-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/techpulse}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_PAT=${GITHUB_PAT}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost", "http://localhost:80", "http://localhost:5173"]}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Celery Background Worker (Ingestion & ML Inference) ───
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techpulse-celery-worker
    restart: always
    command: celery -A backend.app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/techpulse}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GITHUB_PAT=${GITHUB_PAT}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY}
    depends_on:
      - backend
      - redis

  # ─── Celery Beat Scheduler (Daily Cron Pipelines) ───
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techpulse-celery-beat
    restart: always
    command: celery -A backend.app.tasks.celery_app.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      - redis

  # ─── Frontend (React/Nginx) ───
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: techpulse-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  # ─── Local Redis Cache & Broker ───
  redis:
    image: redis:7-alpine
    container_name: techpulse-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Local PostgreSQL 15 Database (Optional if using Supabase) ───
  postgres:
    image: postgres:15-alpine
    container_name: techpulse-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=techpulse
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  pg_data:

