services:
  # ─── FastAPI Web Service ───
  - type: web
    name: techpulse-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      # ── Required: Set these in Render Dashboard → Environment ──
      - key: DATABASE_URL
        sync: false   # Supabase PostgreSQL URL (see DEPLOYMENT.md)
      - key: REDIS_URL
        sync: false   # Upstash Redis URL (optional — in-memory fallback used if absent)
      - key: GROQ_API_KEY
        sync: false   # Required for AI insight synthesis
      - key: GITHUB_PAT
        sync: false   # Optional but recommended for higher GitHub rate limits
      # ── CORS: update with your Vercel frontend URL ──
      - key: CORS_ORIGINS
        value: '["https://techpulse-ai.vercel.app","http://localhost:5173","http://localhost:3000"]'

  # ─── Celery Ingestion & ML Worker ───
  # NOTE: Only enable this if you have REDIS_URL configured.
  # Free Render accounts can omit this — use GitHub Actions daily-ingest.yml instead.
  - type: worker
    name: techpulse-celery-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A backend.app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_PAT
        sync: false

  # ─── Celery Beat Scheduler (Daily Cron Pipelines) ───
  # NOTE: Only enable this if you have REDIS_URL configured.
  - type: worker
    name: techpulse-celery-beat
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A backend.app.tasks.celery_app.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
